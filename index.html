<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Very Cool Cube</title>
    <meta name="description" content="A simple 3D cube.">
    <meta name="theme-color" content="#0d1117">

    <link rel="canonical" href="https://verycoolcube.github.io/">
    <link rel="icon" href="./favicon.png" type="image/png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Very Cool Cube">
    <meta property="og:description" content="it's literally just a cube">
    <meta property="og:url" content="https://verycoolcube.github.io/">
    <meta property="og:image" content="https://verycoolcube.github.io/favicon.png">
    <meta name="twitter:card" content="summary">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* okay okay you got it, code is qweqwe */

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            
            --sys-init: 1;
        }

        #cubeCanvas {
            width: 400px;
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        .github-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            color: #58a6ff;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .github-link:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        p {
            font-size: 1rem;
            color: #8b949e;
            margin: 4px 0;
        }

        .subtext {
            font-size: 0.85rem;
            color: #484f58;
            margin-top: 8px;
        }

        #qwerty-container {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            transition: opacity 0.3s ease;
        }

        .key {
            width: 40px;
            height: 40px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1.1rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
        }

        .key:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }

        .key:active, .key.pressed {
            background-color: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
            transform: translateY(2px);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- TODO: check keyboard sequence integrity -->

    <canvas id="cubeCanvas" role="img" aria-label="Animated 3D cube rotating in space">
        Your browser does not support the canvas element, sorry
    </canvas>

    <a id="github-btn" class="github-link" href="https://github.com/verycoolcube/verycoolcube.github.io" target="_blank" rel="noopener">
        if you like this site, star it on github pls
    </a>

    <h1 id="title">it’s literally just a cube</h1>
    <p>it doesn't require OpenGL or Vulkan</p>
    <p><b>kub</b></p>
    <p>enjoy.</p>
    <p class="subtext">or don't...</p>
    <p class="subtext" style="font-size: 0.75rem;">nah, forget it</p>

    <div id="qwerty-container">
        <div class="key" data-key="q">q</div>
        <div class="key" data-key="w">w</div>
        <div class="key" data-key="e">e</div>
        <div class="key" data-key="r">r</div>
        <div class="key" data-key="t">t</div>
        <div class="key" data-key="y">y</div>
    </div>

    <script>
        (() => {
            console.log("%cLooking for the source code? It's literally just a cube, no deep meaning here. (nice try though)", "color: #58a6ff; font-size: 14px; font-family: sans-serif;");

            const SIZE = 400;
            const DISTANCE = 400;
            const CUBE_SCALE = 100;

            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const canvas = document.getElementById('cubeCanvas');
            const ctx = canvas.getContext('2d');

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width  = SIZE * dpr;
            canvas.height = SIZE * dpr;
            ctx.scale(dpr, dpr);

            const vertices = [
                {x: -1, y: -1, z: -1}, {x: 1, y: -1, z: -1},
                {x: 1, y: 1, z: -1},  {x: -1, y: 1, z: -1},
                {x: -1, y: -1, z: 1},  {x: 1, y: -1, z: 1},
                {x: 1, y: 1, z: 1},   {x: -1, y: 1, z: 1}
            ];

            const edges = [
                [0, 1], [1, 2], [2, 3], [3, 0],
                [4, 5], [5, 6], [6, 7], [7, 4],
                [0, 4], [1, 5], [2, 6], [3, 7]
            ];

            let angleX = 0;
            let angleY = 0;

            const isRainbow = Math.random() < 0.1;
            let hue = Math.random() * 360;
            // second part of the decoder
            let rafId = null;

            let mode = 'cube';
            let fragments = [];
            let triangleAngle = 0;
            // end
            
            
            
            
            
            
            
            
            
            
            
            
            
            
            
            // hi




















            // definitely not the secret code obfuscated via base64
            const _0xSecret = 'cXl3dGVyIHwgfCBZb3UgZm91bmQgdGhlIHNlY3JldC4gQnV0IHdhaXQsIHlvdSBhY3R1YWxseSBkZWNvZGVkIHRoaXM/IEkgbWVhbiwgeW91IGNvdWxkIGhhdmUganVzdCB0eXBlZCBpdC4gSSBndWVzcyBJIHJlc3BlY3QgdGhlIGVmZm9ydC4gQnV0IGNvbWUgb24sIGl0J3MgbGl0ZXJhbGx5IGp1c3QgYSBjdWJlLiBEaWQgeW91IHJlYWxseSB0aGluayB0aGVyZSB3YXMgYSBoaWRkZW4gbWVzc2FnZT8gV2VsbCwgdGhlcmUgaXMgbm93LiBHbyB0b3VjaCBzb21lIGdyYXNzIG9yIHNvbWV0aGluZy4gKGxvbCk='; 

            // not useless
            const uselessArray1 = ['w', 'e', 'r', 't', 'y'];
            const uselessArray2 = ['a', 'b', 'c'];
            let _0xInit = false;
            let _0xHash = 0xDEADBEEF;

            let _0xKeys = ["cXl3dGVy", "dHJpYW5nbGU=", "Y3ViZQ=="];

            let typedSequence = [];

            function _0xCrypt(input, key) {
                let output = "";
                for (let i = 0; i < input.length; i++) {
                    output += String.fromCharCode(input.charCodeAt(i) ^ key);
                }
                return output;
            }

            function _0xValidateEnv() {
                const checks = [
                    typeof window !== 'undefined',
                    typeof document !== 'undefined',
                    _0xHash !== 0,
                    _0xKeys.length === 3
                ];
                return checks.every(c => c === true);
            }

            
            function _0xDecrypt(str) {
                try {
                    const decoded = atob(str);
                    if (decoded.includes(' | | ')) {
                        return decoded.split(' | | ')[0];
                    }
                    return decoded.substring(0, 6); 
                } catch(e) {
                    return '';
                }
            }

            function _0xInitCore() {
                if (_0xInit) return;
                _0xInit = true;
                _0xHash = (_0xHash ^ 0xCAFEBABE) >>> 0;
                
                for (let i = 0; i < uselessArray1.length; i++) {
                    _0xHash += uselessArray1[i].charCodeAt(0);
                }
                _0xHash = _0xHash % 0xFFFF;

                // debug log that looks like gibberish
                // 113 121 119 116 101 114 => q y w t e r
                console.log("SysCheck: " + [113, 121, 119, 116, 101, 114].join(' '));
            }

            function _0xCheckSequence() {
                return typedSequence.join('').toLowerCase(); 
            }

            _0xInitCore();

            function getColors() {
                if (isRainbow) {
                    return `hsl(${hue.toFixed(1)}, 100%, 65%)`;
                }
                return '#f0f6fc';
            }

            function playSynthSound() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();

                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();

                    oscillator.type = 'sawtooth';
                    
                    const now = audioCtx.currentTime;
                    
                    oscillator.frequency.setValueAtTime(300, now);
                    oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1); 
                    oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.5); 

                    gainNode.gain.setValueAtTime(0.5, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    oscillator.start(now);
                    oscillator.stop(now + 0.5);
                } catch (e) {
                    console.warn("damn", e);
                }
            }

            function projectCube() {
                const radX = angleX * Math.PI / 180;
                const radY = angleY * Math.PI / 180;
                const cosX = Math.cos(radX), sinX = Math.sin(radX);
                const cosY = Math.cos(radY), sinY = Math.sin(radY);

                const projected = [];
                for (let i = 0; i < vertices.length; i++) {
                    const p = vertices[i];
                    const x = p.x * CUBE_SCALE;
                    const y = p.y * CUBE_SCALE;
                    const z = p.z * CUBE_SCALE;

                    const x1 = x * cosY - z * sinY;
                    const z1 = x * sinY + z * cosY;
                    const y2 = y * cosX - z1 * sinX;
                    const z2 = y * sinX + z1 * cosX;

                    const perspective = DISTANCE / (DISTANCE + z2);
                    projected.push({
                        x: SIZE / 2 + x1 * perspective,
                        y: SIZE / 2 + y2 * perspective
                    });
                }
                return projected;
            }

            function createExplosion(projected) {
                fragments = [];
                const color = getColors();
                for (const [a, b] of edges) {
                    const p1 = projected[a];
                    const p2 = projected[b];
                    const segmentsCount = 4;

                    for (let i = 0; i < segmentsCount; i++) {
                        const t1 = i / segmentsCount;
                        const t2 = (i + 1) / segmentsCount;

                        const x1 = p1.x + (p2.x - p1.x) * t1;
                        const y1 = p1.y + (p2.y - p1.y) * t1;
                        const x2 = p1.x + (p2.x - p1.x) * t2;
                        const y2 = p1.y + (p2.y - p1.y) * t2;

                        const cx = (x1 + x2) / 2;
                        const cy = (y1 + y2) / 2;
                        const len = Math.hypot(x2 - x1, y2 - y1);
                        const angle = Math.atan2(y2 - y1, x2 - x1);

                        const dx = cx - SIZE / 2;
                        const dy = cy - SIZE / 2;
                        const dist = Math.hypot(dx, dy) || 1;

                        fragments.push({
                            x: cx, y: cy,
                            vx: (dx / dist) * (Math.random() * 8 + 3),
                            vy: (dy / dist) * (Math.random() * 8 + 3),
                            angle: angle,
                            vAngle: (Math.random() - 0.5) * 0.3,
                            length: len,
                            life: 1,
                            color: color
                        });
                    }
                }
            }

            function triggerEasterEgg() {
                if (!_0xValidateEnv()) return;
                if (mode !== 'cube') return;
                
                mode = 'explode';

                console.log("%cYou found it! The secret is... just a cube. Nothing else.", "color: #58a6ff; font-size: 16px; font-weight: bold;");

                playSynthSound();

                document.getElementById('github-btn').innerText = 'hi';
                document.getElementById('title').innerText = 'hi';
                document.querySelectorAll('p').forEach(p => p.innerText = 'hi');
                document.getElementById('qwerty-container').classList.add('hidden');

                const currentProjected = projectCube();
                createExplosion(currentProjected);

                setTimeout(() => {
                    mode = 'triangle';
                }, 1200);
            }

            function draw() {
                ctx.clearRect(0, 0, SIZE, SIZE);

                if (isRainbow) {
                    hue = (hue + 1.5) % 360;
                }

                if (mode === 'cube') {
                    const projected = projectCube();
                    ctx.strokeStyle = getColors();
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    for (const [a, b] of edges) {
                        ctx.moveTo(projected[a].x, projected[a].y);
                        ctx.lineTo(projected[b].x, projected[b].y);
                    }
                    ctx.stroke();

                    if (!reduceMotion) {
                        angleX += 0.2;
                        angleY += 0.4;
                    }
                } 
                // decoder
                else if (mode === 'explode') {
                    for (let i = fragments.length - 1; i >= 0; i--) {
                        const f = fragments[i];
                        f.x += f.vx;
                        f.y += f.vy;
                        f.vx *= 0.96;
                        f.vy *= 0.96;
                        f.angle += f.vAngle;
                        f.life -= 0.02;

                        if (f.life <= 0) {
                            fragments.splice(i, 1);
                            continue;
                        }

                        ctx.strokeStyle = f.color;
                        ctx.lineWidth = 2 * f.life;
                        ctx.globalAlpha = f.life;
                        ctx.lineCap = 'round';
                        
                        const dx = Math.cos(f.angle) * (f.length / 2);
                        const dy = Math.sin(f.angle) * (f.length / 2);
                        
                        ctx.beginPath();
                        ctx.moveTo(f.x - dx, f.y - dy);
                        ctx.lineTo(f.x + dx, f.y + dy);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                } 
                else if (mode === 'triangle') {
                    ctx.strokeStyle = getColors();
                    ctx.lineWidth = 3;
                    ctx.lineJoin = 'round';
                    
                    const r = 100;
                    const rad = triangleAngle * Math.PI / 180;
                    
                    ctx.beginPath();
                    for (let i = 0; i < 3; i++) {
                        const angle = rad + (i * Math.PI * 2 / 3) - Math.PI / 2;
                        const x = SIZE / 2 + Math.cos(angle) * r;
                        const y = SIZE / 2 + Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.stroke();

                    if (!reduceMotion) {
                        triangleAngle += 1;
                    }
                }
            }

            function loop() {
                draw();
                if (reduceMotion && mode !== 'explode') return; 
                rafId = requestAnimationFrame(loop);
            }

            function handleKeyInput(key) {
                if (mode !== 'cube') return;
                
                const btn = document.querySelector(`.key[data-key="${key}"]`);
                if (btn) {
                    btn.classList.add('pressed');
                    setTimeout(() => btn.classList.remove('pressed'), 150);
                }

                typedSequence.push(key);
                
                if (typedSequence.length > 6) {
                    typedSequence.shift();
                }

                if (_0xDecrypt(_0xSecret) === _0xCheckSequence()) {
                    triggerEasterEgg();
                }
            }

            document.querySelectorAll('.key').forEach(btn => {
                btn.addEventListener('click', () => handleKeyInput(btn.dataset.key));
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleKeyInput(btn.dataset.key);
                }, {passive: false});
            });

            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key.length === 1 && key >= 'a' && key <= 'z') {
                    handleKeyInput(key);
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (reduceMotion) return;
                if (document.hidden) {
                    if (rafId !== null) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                } else if (rafId === null) {
                    loop();
                }
            });

            loop();
        })();
    </script>
</body>
</html>
