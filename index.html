<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple 3D cube rendered in pure JavaScript without OpenGL or Vulkan.">
    <title>Very Cool Cube</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        #cubeCanvas {
            margin-bottom: 20px;
        }

        /* Аккуратная текстовая ссылка-кнопка */
        .github-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            color: #58a6ff;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .github-link:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        p {
            font-size: 1rem;
            color: #8b949e;
            margin: 4px 0;
        }

        .subtext {
            font-size: 0.85rem;
            color: #484f58;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <canvas id="cubeCanvas" width="400" height="400"></canvas>

    <a class="github-link" href="https://github.com/verycoolcube/verycoolcube.github.io" target="_blank" rel="noopener">
        if you like this site, please star it on github pls
    </a>

    <h1>it’s literally just a cube</h1>
    <p>it doesn't require OpenGL or Vulkan</p>
    <p><b>kub</b></p>
    <p>enjoy.</p>
    <p class="subtext">or don't...</p>
    <p class="subtext" style="font-size: 0.75rem;">nah, forget it</p>

    <script>
        const canvas = document.getElementById('cubeCanvas');
        const ctx = canvas.getContext('2d');

        const vertices = [
            {x: -1, y: -1, z: -1}, {x: 1, y: -1, z: -1},
            {x: 1, y: 1, z: -1},  {x: -1, y: 1, z: -1},
            {x: -1, y: -1, z: 1},  {x: 1, y: -1, z: 1},
            {x: 1, y: 1, z: 1},   {x: -1, y: 1, z: 1}
        ];

        const edges = [
            [0, 1], [1, 2], [2, 3], [3, 0],
            [4, 5], [5, 6], [6, 7], [7, 4],
            [0, 4], [1, 5], [2, 6], [3, 7]
        ];

        let angleX = 0;
        let angleY = 0;

        function projectAndDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            /* Белые четкие линии куба на темном фоне */
            ctx.strokeStyle = '#f0f6fc';
            ctx.lineWidth = 2;

            const projectedVertices = [];
            const radX = angleX * Math.PI / 180;
            const radY = angleY * Math.PI / 180;
            const cosX = Math.cos(radX), sinX = Math.sin(radX);
            const cosY = Math.cos(radY), sinY = Math.sin(radY);

            for (let i = 0; i < vertices.length; i++) {
                let p = vertices[i];

                let x = p.x * 100;
                let y = p.y * 100;
                let z = p.z * 100;

                let x1 = x * cosY - z * sinY;
                let z1 = x * sinY + z * cosY;

                let y2 = y * cosX - z1 * sinX;
                let z2 = y * sinX + z1 * cosX;

                const distance = 400;
                const perspective = distance / (distance + z2);
                
                const screenX = canvas.width / 2 + x1 * perspective;
                const screenY = canvas.height / 2 + y2 * perspective;

                projectedVertices.push({x: screenX, y: screenY});
            }

            for (let i = 0; i < edges.length; i++) {
                const start = projectedVertices[edges[i][0]];
                const end = projectedVertices[edges[i][1]];

                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.stroke();
            }

            angleX += 0.2;
            angleY += 0.4;

            requestAnimationFrame(projectAndDraw);
        }

        projectAndDraw();
    </script>
</body>
</html>
