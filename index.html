<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Very Cool Cube</title>
    <meta name="description" content="A simple 3D cube.">
    <meta name="theme-color" content="#0d1117">

    <link rel="canonical" href="https://verycoolcube.github.io/">
    <link rel="icon" href="./favicon.png" type="image/png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Very Cool Cube">
    <meta property="og:description" content="it's literally just a cube">
    <meta property="og:url" content="https://verycoolcube.github.io/">
    <meta property="og:image" content="https://verycoolcube.github.io/favicon.png">
    <meta name="twitter:card" content="summary">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        #cubeCanvas {
            width: 400px;
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        .github-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            color: #58a6ff;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .github-link:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        p {
            font-size: 1rem;
            color: #8b949e;
            margin: 4px 0;
        }

        .subtext {
            font-size: 0.85rem;
            color: #484f58;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <canvas id="cubeCanvas" role="img" aria-label="Animated 3D cube rotating in space">
        Your browser does not support the canvas element sorry
    </canvas>

    <a class="github-link" href="https://github.com/verycoolcube/verycoolcube.github.io" target="_blank" rel="noopener">
        if you like this site, star it on github pls
    </a>

    <h1>it’s literally just a cube</h1>
    <p>it doesn't require OpenGL or Vulkan</p>
    <p><b>kub</b></p>
    <p>enjoy.</p>
    <p class="subtext">or don't...</p>
    <p class="subtext" style="font-size: 0.75rem;">nah, forget it</p>

    <script>
        (() => {
            const SIZE = 400;
            const DISTANCE = 400;
            const CUBE_SCALE = 100;

            // Если захочешь эффект глубины — поставь true.
            // По умолчанию выключен: все рёбра одинаковые и ровные.
            const USE_DEPTH = false;
            const DEPTH_RANGE = 180; // макс |z| после поворотов

            const reduceMotion =
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const canvas = document.getElementById('cubeCanvas');
            const ctx = canvas.getContext('2d');

            // Retina fix
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width  = SIZE * dpr;
            canvas.height = SIZE * dpr;
            ctx.scale(dpr, dpr);

            const vertices = [
                {x: -1, y: -1, z: -1}, {x: 1, y: -1, z: -1},
                {x: 1, y: 1, z: -1},  {x: -1, y: 1, z: -1},
                {x: -1, y: -1, z: 1},  {x: 1, y: -1, z: 1},
                {x: 1, y: 1, z: 1},   {x: -1, y: 1, z: 1}
            ];

            const edges = [
                [0, 1], [1, 2], [2, 3], [3, 0],
                [4, 5], [5, 6], [6, 7], [7, 4],
                [0, 4], [1, 5], [2, 6], [3, 7]
            ];

            let angleX = 0;
            let angleY = 0;

            const isRainbow = Math.random() < 0.1;
            let hue = Math.random() * 360;

            let rafId = null;

            function draw() {
                ctx.clearRect(0, 0, SIZE, SIZE);

                if (isRainbow) {
                    ctx.strokeStyle = `hsl(${hue.toFixed(1)}, 100%, 65%)`;
                    hue = (hue + 1.5) % 360;
                } else {
                    ctx.strokeStyle = '#f0f6fc';
                }

                const radX = angleX * Math.PI / 180;
                const radY = angleY * Math.PI / 180;
                const cosX = Math.cos(radX), sinX = Math.sin(radX);
                const cosY = Math.cos(radY), sinY = Math.sin(radY);

                const projected = new Array(vertices.length);
                const zValues   = new Array(vertices.length);

                for (let i = 0; i < vertices.length; i++) {
                    const p = vertices[i];
                    const x = p.x * CUBE_SCALE;
                    const y = p.y * CUBE_SCALE;
                    const z = p.z * CUBE_SCALE;

                    const x1 = x * cosY - z * sinY;
                    const z1 = x * sinY + z * cosY;

                    const y2 = y * cosX - z1 * sinX;
                    const z2 = y * sinX + z1 * cosX;

                    const perspective = DISTANCE / (DISTANCE + z2);
                    projected[i] = {
                        x: SIZE / 2 + x1 * perspective,
                        y: SIZE / 2 + y2 * perspective
                    };
                    zValues[i] = z2;
                }

                if (USE_DEPTH) {
                    // Дальние рёбра бледнее, ближние ярче.
                    // lineCap='butt' — чтобы на стыках не было «шишечек».
                    ctx.lineCap = 'butt';

                    const sorted = edges
                        .map(e => ({ e, z: (zValues[e[0]] + zValues[e[1]]) * 0.5 }))
                        .sort((a, b) => b.z - a.z);

                    for (const { e, z } of sorted) {
                        const t = Math.max(
                            0,
                            Math.min(1, (z + DEPTH_RANGE) / (2 * DEPTH_RANGE))
                        );

                        ctx.globalAlpha = 0.35 + (1 - t) * 0.65; // 1.0 → 0.35
                        ctx.lineWidth   = 2;

                        const a = projected[e[0]];
                        const b = projected[e[1]];

                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }

                    ctx.globalAlpha = 1;
                } else {
                    // Чистый вариант: все рёбра одним путём, одинаковый стиль.
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    for (const [a, b] of edges) {
                        ctx.moveTo(projected[a].x, projected[a].y);
                        ctx.lineTo(projected[b].x, projected[b].y);
                    }
                    ctx.stroke();
                }

                if (!reduceMotion) {
                    angleX += 0.2;
                    angleY += 0.4;
                }
            }

            function loop() {
                draw();
                if (reduceMotion) return;
                rafId = requestAnimationFrame(loop);
            }

            document.addEventListener('visibilitychange', () => {
                if (reduceMotion) return;

                if (document.hidden) {
                    if (rafId !== null) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                } else if (rafId === null) {
                    loop();
                }
            });

            loop();
        })();
    </script>
</body>
</html>
